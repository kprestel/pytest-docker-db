[project]
name = "pytest-docker-db"
version = "1.1.0"
description = "A plugin to use docker databases for pytest tests"
authors = [{ name = "Kyle Prestel", email = "kprestel@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "docker",
    "pytest",
]

[project.entry-points.pytest11]
docker-db = "pytest_docker_db.plugin"

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "ruff",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["pytest_docker_db"]
warn_unused_ignores = true
show_error_codes = true
# Ignore missing imports for third-party packages without stubs (tweak if you add stubs)
ignore_missing_imports = true
